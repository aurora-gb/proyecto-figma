<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | [Blogr]</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <section class="container__header-hero">
      <header class="header">
        <div class="header__container-logo-nav">
          <img class="header__logo" src="./assets/images/logo.svg" alt="" />
          <nav class="header__nav">
            <ul>
              <li><p>Product</p><img src="./assets/images/Path 3 Copy.svg" alt=""></li>
              <li><p>Connect</p><img src="./assets/images/Path 3 Copy.svg" alt=""></li>
              <li><p>Company</p><img src="./assets/images/Path 3 Copy.svg" alt=""></li>
            </ul>
          </nav>
        </div>
        <div class="header__p-button">
          <p>Login</p>
          <button>Sign up</button>
        </div>
      </header>
      <section class="section__hero">
        <div class="hero__text">
          <h1>A modern publishing platform</h1>
          <p>Grow your audience and build your online brand</p>
        </div>
        <div class="hero__butons">
          <button>Start for Free</button>
          <button>Learn More</button>
        </div>
      </section>
    </section>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
